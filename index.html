<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<title>University Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zen+Dots&display=swap" rel="stylesheet">
<script src="tailwind.js"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: {
  fontFamily: { sans: ['Inter','system-ui','sans-serif'], title: ['Zen Dots','Inter','sans-serif'] },
  colors: { slate850: '#1E293B', ink: '#0B1220' } } } };
</script>
<style>
  .lp { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { -webkit-tap-highlight-color: transparent; }
  .fade-in { animation: fi .25s ease both; }
  @keyframes fi { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none; } }
  .safe-b { padding-bottom: env(safe-area-inset-bottom); }
  ::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-thumb { background:#33415588; border-radius: 9px; }
  .dropzone.over { border-color:#10B981; background:#10B98122; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-ink dark:text-slate-100 font-sans min-h-screen transition-colors">

<div id="toasts" class="fixed top-3 left-0 right-0 z-[60] flex flex-col items-center gap-2 px-3 pointer-events-none"></div>

<header class="sticky top-0 z-40 backdrop-blur bg-white/80 dark:bg-ink/80 border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-3xl mx-auto flex items-center justify-between px-4 py-3">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 grid place-items-center text-white shadow-lg shadow-emerald-500/30">🎓</div>
      <div>
        <h1 class="font-title text-base leading-tight bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text         text-transparent">University Planner</h1>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">By Megabyte</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnBell" class="relative w-10 h-10 rounded-2xl bg-slate-200 dark:bg-slate850 grid place-items-center hover:scale-105 transition" title="Notificaciones">🔔<span id="bellDot" class="hidden absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-emerald-400"></span></button>
      <button id="btnTheme" class="w-10 h-10 rounded-2xl bg-slate-200 dark:bg-slate850 grid place-items-center hover:scale-105 transition" title="Tema">🌓</button>
      <button id="btnAcc" class="w-10 h-10 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 text-white font-bold overflow-hidden grid place-items-center hover:scale-105 transition" title="Mi cuenta"></button>
    </div>
  </div>
</header>

<main id="view" class="max-w-3xl mx-auto px-4 pt-4 pb-28"></main>

<!-- Bottom nav -->
<nav class="fixed bottom-0 inset-x-0 z-40 bg-white/90 dark:bg-slate850/95 backdrop-blur border-t border-slate-200 dark:border-slate-700 safe-b">
  <div class="max-w-3xl mx-auto grid grid-cols-5 text-[11px] font-medium" id="nav"></div>
</nav>

<!-- FAB -->
<button id="fab" class="fixed z-40 right-4 bottom-20 w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white text-3xl shadow-xl shadow-emerald-600/40 hover:scale-105 active:scale-95 transition" aria-label="Nuevo pendiente">+</button>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-end sm:items-center justify-center">
  <div id="modalBox" class="w-full sm:max-w-md max-h-[92vh] overflow-y-auto bg-white dark:bg-slate850 rounded-t-3xl sm:rounded-3xl p-5 fade-in"></div>
</div>

<script>
/* ================== Utilidades ================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const daysUntil = s => Math.round((parseISO(s) - today0()) / 864e5);
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo']; // índice 0 = lunes
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayIdx = d => (d.getDay() + 6) % 7;
const fmtDate = s => { const d = parseISO(s); return `${DAYS[dayIdx(d)].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };

const TYPES = {
  parcial: { label: 'Parcial', icon: '📝', cls: 'bg-rose-500/15 text-rose-500 dark:text-rose-300', dot: 'bg-rose-500' },
  quiz:    { label: 'Quiz',    icon: '⚡', cls: 'bg-amber-500/15 text-amber-600 dark:text-amber-300', dot: 'bg-amber-400' },
  trabajo: { label: 'Trabajo', icon: '📦', cls: 'bg-sky-500/15 text-sky-600 dark:text-sky-300', dot: 'bg-sky-400' },
  tarea:   { label: 'Tarea',   icon: '✅', cls: 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300', dot: 'bg-emerald-400' },
};
const REMINDERS = [7, 3, 1, 0];
const REM_LABEL = { 7: 'en 1 semana', 3: 'en 3 días', 1: 'mañana', 0: 'hoy' };

/* ================== Estado / localStorage ================== */
/* Pega aquí la configuración de tu app web de Firebase (Configuración del proyecto → Tus apps). Ver README.
   Vacía = la app funciona solo en local, sin cuentas en la nube. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAhp_IhVX8cRlMdV2OhR1wGFJNcdZSoDpg",
  authDomain: "university-planner-2020e.firebaseapp.com",
  projectId: "university-planner-2020e",
  storageBucket: "university-planner-2020e.firebasestorage.app",
  messagingSenderId: "523569338497",
  appId: "1:523569338497:web:517fe23f9f4f0fa46c1580"
};
const FB_ON = !!FIREBASE_CONFIG.apiKey;
/* Opcional: limita el acceso a dominios, p. ej. ['cun.edu.co']. Vacío = cualquier cuenta de Google. */
const ALLOWED_DOMAINS = [];

const LEGACY_KEY = 'studytask.v1';
const SESSION = (() => { try { const s = JSON.parse(localStorage.getItem('up.session')); return s && s.email ? s : null; } catch { return null; } })();
const KEY = SESSION ? 'up.data.' + SESSION.email.toLowerCase() : 'up.guest';
if (SESSION && !localStorage.getItem(KEY) && localStorage.getItem(LEGACY_KEY) && !localStorage.getItem('up.legacyClaimed')) {
  localStorage.setItem(KEY, localStorage.getItem(LEGACY_KEY)); localStorage.setItem('up.legacyClaimed', SESSION.email);
}
let state = (() => {
  try { return Object.assign({ tasks: [], classes: [], notifs: [], theme: 'dark', seenNotifs: 0, name: '' }, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch { return { tasks: [], classes: [], notifs: [], theme: 'dark', seenNotifs: 0, name: '' }; }
})();
const cloud = { ready: false, applying: false, lastJson: '', timer: null, ref: null, unsub: null, chatUnsub: null, chatCol: null };
const cloudPayload = () => JSON.stringify({ tasks: state.tasks, classes: state.classes, name: state.name, theme: state.theme, groupCode: state.groupCode || '' });
const save = () => {
  if (cloud.ready && !cloud.applying && cloudPayload() !== cloud.lastJson) state.cloudAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  if (cloud.ready && !cloud.applying) { clearTimeout(cloud.timer); cloud.timer = setTimeout(cloudPush, 1500); }
};
state.chat ??= []; state.rooms ??= []; state.deviceId ||= uid();
state.pomo ??= { mode: '25', phase: 'focus', running: false, endsAt: 0, left: 25 * 60, count: 0, day: iso(new Date()) };

let tab = 'home';
let cal = { y: new Date().getFullYear(), m: new Date().getMonth(), sel: iso(new Date()) };
let filter = 'all';

/* ================== UI base ================== */
function toast(msg, icon = '✨') {
  const t = document.createElement('div');
  t.className = 'pointer-events-auto max-w-sm w-full flex gap-2 items-start bg-slate-900 text-white border border-emerald-500/40 rounded-2xl px-4 py-3 shadow-xl fade-in text-sm';
  t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 4500);
}
function applyTheme() { document.documentElement.classList.toggle('dark', state.theme === 'dark'); }
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.remove('hidden'); $('#modal').classList.add('flex'); }
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

const NAV = [['home','🏠','Inicio'],['week','🗓️','Horario'],['cal','📅','Calendario'],['tasks','📋','Pendientes'],['more','✨','Más']];
function renderNav() {
  $('#nav').innerHTML = NAV.map(([k, i, l]) => `
    <button data-tab="${k}" class="py-2.5 flex flex-col items-center gap-0.5 transition ${tab === k ? 'text-emerald-500' : 'text-slate-500 dark:text-slate-400'}">
      <span class="text-xl ${tab === k ? 'scale-110' : ''} transition">${i}</span>${l}</button>`).join('');
  $('#fab').classList.toggle('hidden', tab === 'more');
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; sub = null; render(); window.scrollTo(0, 0); } });
$('#btnTheme').onclick = () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
$('#fab').onclick = () => taskForm();
$('#btnBell').onclick = () => notifCenter();

const card = 'bg-white dark:bg-slate850 rounded-2xl shadow-sm border border-slate-200/70 dark:border-slate-700/50';
const inputCls = 'w-full rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500';
const btnP = 'rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-semibold px-4 py-2.5 text-sm shadow-lg shadow-emerald-600/25 hover:brightness-110 active:scale-95 transition';
const btnG = 'rounded-xl bg-slate-200 dark:bg-slate-700 font-medium px-4 py-2.5 text-sm hover:brightness-95 active:scale-95 transition';

function render() {
  renderNav();
  const v = $('#view');
  v.innerHTML = `<div class="fade-in">${({ home: viewHome, week: viewWeek, cal: viewCal, tasks: viewTasks, more: viewMore }[tab])()}</div>`;
  ({ home: bindHome, week: bindWeek, cal: bindCal, tasks: bindTasks, more: bindMore }[tab])();
  $('#bellDot').classList.toggle('hidden', state.notifs.length <= state.seenNotifs);
}

/* ================== Tarjeta de pendiente ================== */
const pending = () => state.tasks.filter(t => !t.done).sort((a, b) => (a.date + (a.time || '99')).localeCompare(b.date + (b.time || '99')));
function whenLabel(d) { return d < 0 ? `Venció hace ${-d} d` : d === 0 ? '¡HOY!' : d === 1 ? 'Mañana' : `En ${d} días`; }
function taskCard(t) {
  const ty = TYPES[t.type] || TYPES.tarea, d = daysUntil(t.date);
  const urgent = !t.done && d <= 1;
  return `<div class="${card} p-3.5 flex gap-3 items-start ${t.done ? 'opacity-50' : ''} ${urgent && d >= 0 ? 'ring-1 ring-emerald-500/60' : ''}">
    <button data-act="toggle" data-id="${t.id}" class="mt-0.5 w-6 h-6 rounded-lg border-2 ${t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-400'} grid place-items-center text-xs shrink-0">${t.done ? '✓' : ''}</button>
    <div class="flex-1 min-w-0">
      <div class="flex flex-wrap items-center gap-1.5 mb-1">
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${ty.cls}">${ty.icon} ${ty.label}</span>
        ${t.subject ? `<span class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${esc(t.subject)}</span>` : ''}
      </div>
      <p class="font-semibold text-sm ${t.done ? 'line-through' : ''}">${esc(t.title)}</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${fmtDate(t.date)}${t.time ? ' · ' + esc(t.time) : ''}${t.teacher ? ' · 👤 ' + esc(t.teacher) : ''}</p>
      ${t.notes ? `<p class="text-xs mt-1 text-slate-500 dark:text-slate-400">${esc(t.notes)}</p>` : ''}
    </div>
    <div class="flex flex-col items-end gap-1 shrink-0">
      ${t.done ? '' : `<span class="text-[11px] font-bold ${d < 0 ? 'text-rose-500' : d <= 1 ? 'text-emerald-500' : 'text-slate-400'}">${whenLabel(d)}</span>`}
      <div class="flex gap-1">
        <button data-act="edit" data-id="${t.id}" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-sm" aria-label="Editar">✏️</button>
        <button data-act="del" data-id="${t.id}" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-sm" aria-label="Eliminar">🗑️</button>
      </div>
    </div></div>`;
}
function bindTaskActions(root) {
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const t = state.tasks.find(x => x.id === b.dataset.id); if (!t) return;
    if (b.dataset.act === 'toggle') { t.done = !t.done; save(); render(); }
    if (b.dataset.act === 'edit') taskForm(t);
    if (b.dataset.act === 'del' && confirm('¿Eliminar este pendiente?')) { state.tasks = state.tasks.filter(x => x !== t); save(); render(); }
  });
}

/* ================== Dashboard ================== */
function viewHome() {
  const list = pending().filter(t => daysUntil(t.date) >= 0);
  const next = list[0], rest = list.slice(1, 6);
  const todayCount = list.filter(t => daysUntil(t.date) === 0).length;
  const h = new Date().getHours();
  const greet = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const lastAdd = localStorage.getItem('studytask.lastAdd');
  const addedToday = lastAdd === iso(new Date());
  const banner = !addedToday
    ? `<div class="rounded-2xl p-4 bg-gradient-to-r from-teal-700 to-emerald-600 text-white flex gap-3 items-center shadow-lg">
         <span class="text-2xl">💡</span>
         <div class="flex-1 text-sm"><b>¿Qué pasó hoy en la U?</b><br><span class="opacity-90">Registra tus pendientes del día para no olvidar nada.</span></div>
         <button id="bannerAdd" class="bg-white/20 hover:bg-white/30 rounded-xl px-3 py-2 text-xs font-semibold">Agregar</button></div>`
    : `<div class="rounded-2xl p-4 bg-emerald-500/10 border border-emerald-500/30 text-sm text-emerald-600 dark:text-emerald-300">🔥 ¡Genial! Ya registraste pendientes hoy. Sigue así.</div>`;

  const nd = next ? daysUntil(next.date) : null, nty = next ? (TYPES[next.type] || TYPES.tarea) : null;
  const hero = next ? `
    <div class="rounded-3xl p-5 bg-gradient-to-br from-emerald-500 via-emerald-600 to-teal-800 text-white shadow-xl shadow-emerald-700/30">
      <p class="text-xs uppercase tracking-widest opacity-80">Lo próximo</p>
      <div class="flex items-end justify-between mt-2 gap-3">
        <div class="min-w-0"><span class="text-xs bg-white/20 rounded-full px-2 py-0.5">${nty.icon} ${nty.label}</span>
          <h2 class="text-xl font-bold mt-2 leading-tight">${esc(next.title)}</h2>
          <p class="text-sm opacity-90 mt-1">${esc(next.subject || '')} ${next.teacher ? '· 👤 ' + esc(next.teacher) : ''}</p>
          <p class="text-xs opacity-80 mt-1">${fmtDate(next.date)}${next.time ? ' · ' + esc(next.time) : ''}</p></div>
        <div class="text-center shrink-0"><div class="font-title text-5xl leading-none">${nd}</div><div class="text-xs opacity-90 mt-1">${nd === 1 ? 'día' : 'días'}</div></div>
      </div></div>`
    : `<div class="${card} p-6 text-center"><div class="text-4xl">🎉</div><p class="font-semibold mt-2">Sin pendientes próximos</p><p class="text-sm text-slate-500">Agrega uno con el botón + o usa el asistente IA.</p></div>`;

  const todayClasses = state.classes.filter(c => c.day === dayIdx(new Date())).sort((a, b) => a.start.localeCompare(b.start));
  return `<div class="space-y-4">
    <div><h2 class="text-2xl font-bold">${greet}${state.name ? ', ' + esc(state.name) : ''} 👋 <button id="editName" class="text-sm align-middle opacity-60 hover:opacity-100" aria-label="Cambiar nombre">✏️</button></h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">${DAYS[dayIdx(new Date())]}, ${new Date().getDate()} de ${MONTHS[new Date().getMonth()]} · ${todayCount ? `<b class="text-emerald-500">${todayCount} para hoy</b>` : 'nada para hoy'}</p></div>
    ${banner}${hero}
    <div class="grid grid-cols-3 gap-3 text-center">
      ${['parcial','quiz','trabajo'].map(k => { const n = list.filter(t => t.type === k && daysUntil(t.date) <= 14).length;
        return `<div class="${card} p-3"><div class="text-xl">${TYPES[k].icon}</div><div class="text-xl font-bold">${n}</div><div class="text-[11px] text-slate-500">${TYPES[k].label}${k === 'quiz' ? 'zes' : 'es' === 'x' ? '' : k === 'parcial' ? 'es' : 's'} · 14d</div></div>`; }).join('')}
    </div>
    <section><h3 class="font-semibold mb-2">Clases de hoy</h3>
      ${todayClasses.length ? `<div class="space-y-2">${todayClasses.map(classRow).join('')}</div>` : `<p class="text-sm text-slate-500 ${card} p-4">No tienes clases registradas hoy.</p>`}</section>
    ${rest.length ? `<section><h3 class="font-semibold mb-2">Después de esto</h3><div class="space-y-2" id="homeList">${rest.map(taskCard).join('')}</div></section>` : ''}
  </div>`;
}
function nameForm() {
  openModal(`<h3 class="font-bold text-lg mb-1">👋 ¡Hola! ¿Cómo te llamas?</h3>
    <p class="text-sm text-slate-500 mb-3">Personalizaremos tu experiencia en University Planner.</p>
    <form id="nf" class="space-y-3"><input name="name" maxlength="30" autofocus placeholder="Tu nombre" value="${esc(state.name)}" class="${inputCls}">
    <div class="flex gap-2"><button type="button" onclick="closeModal()" class="${btnG} flex-1">Ahora no</button><button class="${btnP} flex-1">Guardar</button></div></form>`);
  $('#nf').onsubmit = e => { e.preventDefault(); state.name = new FormData(e.target).get('name').trim(); save(); closeModal(); render(); };
}
function bindHome() { const en = $('#editName'); if (en) en.onclick = nameForm; const b = $('#bannerAdd'); if (b) b.onclick = () => taskForm(); bindTaskActions($('#view')); }
function classRow(c) {
  return `<div class="${card} p-3 flex items-center gap-3">
    <div class="text-xs font-mono text-emerald-500 w-24 shrink-0">${esc(c.start)}–${esc(c.end)}</div>
    <div class="flex-1 min-w-0"><p class="font-semibold text-sm truncate">${esc(c.subject)}</p>
    <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${c.teacher ? '👤 ' + esc(c.teacher) : ''} ${c.room ? '· 🚪 ' + esc(c.room) : ''}</p></div></div>`;
}

/* ================== Horario semanal ================== */
let weekMode = 'list';
const weekDays = () => DAYS.map((n, i) => i).filter(i => state.classes.some(c => c.day === i));
function dayCard(i) {
  const today = i === dayIdx(new Date()), n = DAYS[i];
  const cs = state.classes.filter(c => c.day === i).sort((a, b) => a.start.localeCompare(b.start));
  return `<section class="rounded-2xl overflow-hidden shadow-sm ${today ? 'ring-2 ring-emerald-500 shadow-emerald-500/20' : ''} bg-white dark:bg-slate-800">
    <div class="flex items-center gap-3 p-3.5 ${today ? 'bg-gradient-to-r from-emerald-500 to-teal-700 text-white' : 'bg-slate-100 dark:bg-slate-900/70'}">
      <span class="w-12 h-12 rounded-xl grid place-items-center font-bold text-sm ${today ? 'bg-white/20 text-white' : 'bg-emerald-500 text-white'}">${n.slice(0, 3)}</span>
      <div class="flex-1"><h4 class="font-bold">${n}${today ? ' · hoy' : ''}</h4><p class="text-xs ${today ? 'text-white/80' : 'text-slate-500 dark:text-slate-400'}">${cs.length} ${cs.length === 1 ? 'clase' : 'clases'}</p></div></div>
    <div class="divide-y divide-slate-200 dark:divide-slate-700 px-3">${cs.map(c => `<div data-lp-class="${c.id}" class="lp flex gap-3 py-3 items-center">
      <div class="shrink-0 w-[68px] rounded-xl border ${today ? 'border-emerald-500/60' : 'border-slate-200 dark:border-slate-700'} bg-slate-50 dark:bg-slate-900/60 py-1.5 text-center font-bold text-sm leading-tight text-emerald-600 dark:text-emerald-400">${c.start}<div class="h-px w-4 bg-current opacity-60 mx-auto my-1"></div>${c.end}</div>
      <div class="flex-1 min-w-0"><p class="font-bold text-sm uppercase leading-snug">${esc(c.subject)}</p>
        ${c.teacher ? `<p class="text-xs text-slate-500 dark:text-slate-400 uppercase mt-0.5">👤 ${esc(c.teacher)}</p>` : ''}
        ${c.room ? `<p class="text-xs text-slate-500 dark:text-slate-400 uppercase">📍 ${esc(c.room)}</p>` : ''}</div></div>`).join('')}</div></section>`;
}
function viewWeek() {
  const subjects = directory();
  const body = weekMode === 'list'
    ? (weekDays().map(dayCard).join('') || `<p class="text-sm text-slate-500 ${card} p-4">Sin clases todavía. Toca “+ Clase” o importa un pantallazo.</p>`)
    : weekGrid();
  return `<div class="space-y-4">
    <div class="flex items-center justify-between"><h2 class="text-xl font-bold">Horario semanal</h2>

function directory() {

    el.addEventListener('pointerdown', e => { fired = false; x = e.clientX; y = e.clientY; stop(); t = setTimeout(() => { fired = true; navigator.vibrate?.(30); fn(el); }, 500); });
    el.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - x, e.clientY - y) > 10) stop(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => el.addEventListener(n, stop));

function checkReminders() {
  let changed = false;
  state.tasks.forEach(t => {

    const due = REMINDERS.filter(r => d <= r && d >= 0 && !t.fired.includes(r));

/* ================== Asistente IA (parser en español, extensible) ================== */
const WD = { lunes: 0, martes: 1, miercoles: 2, jueves: 3, viernes: 4, sabado: 5, domingo: 6 };
const MN = Object.fromEntries(MONTHS.map((m, i) => [m, i]));
const strip = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const NUMW = { un: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, diez: 10 };

/* Para conectar un LLM real, reemplaza esta función por una llamada a tu API que devuelva el mismo objeto. */
async function aiExtract(text) { return parseNatural(text); }

function parseNatural(raw) {
  const text = raw.trim(), n = strip(text.toLowerCase());
  const res = { type: 'tarea', date: null, time: '', subject: '', teacher: '', title: '', notes: '' };
  // Tipo
  if (/parcial|examen|final|evaluacion/.test(n)) res.type = 'parcial';
  else if (/quiz|quices|prueba corta/.test(n)) res.type = 'quiz';
  else if (/trabajo|entrega|proyecto|informe|taller|exposicion/.test(n)) res.type = 'trabajo';
  // Fecha
  const now = today0(); let d = null, m;
  if (/pasado manana/.test(n)) d = addD(now, 2);
  else if (/\bmanana\b/.test(n) && !/\bmanana\b.*(am|pm)\b.*\bmanana\b/.test(n)) d = addD(now, 1);
  else if (/\bhoy\b/.test(n)) d = now;
  else if ((m = n.match(/\ben (\d+|un|una|dos|tres|cuatro|cinco|seis|siete|diez) (dia|dias|semana|semanas)/))) {
    const q = isNaN(m[1]) ? NUMW[m[1]] : +m[1]; d = addD(now, q * (m[2].startsWith('semana') ? 7 : 1));
  } else if ((m = n.match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?: de (\d{4}))?/))) {
    d = new Date(m[3] ? +m[3] : now.getFullYear(), MN[m[2]], +m[1]); if (!m[3] && d < now) d.setFullYear(d.getFullYear() + 1);
  } else if ((m = n.match(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/))) {
    let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000;
    d = new Date(y, +m[2] - 1, +m[1]); if (!m[3] && d < now) d.setFullYear(y + 1);
  } else if ((m = n.match(/\b(proximo|proxima|este|el|del)?\s*(lunes|martes|miercoles|jueves|viernes|sabado|domingo)\b/))) {
    const target = WD[m[2]]; let diff = (target - dayIdx(now) + 7) % 7;
    if (m[1] === 'proximo' || m[1] === 'proxima') { if (diff === 0) diff = 7; if (/proximo|proxima/.test(m[1]) && diff < 7 && target <= dayIdx(now)) diff = diff || 7; }
    else if (diff === 0) diff = 7;
    d = addD(now, diff);
  }
  if (d) res.date = iso(d);
  // Hora
  if ((m = n.match(/(?:a las |a la |las |\b)(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)/))) {
    let h = +m[1] % 12; if (/^p/.test(m[3])) h += 12; res.time = `${pad(h)}:${m[2] || '00'}`;
  } else if ((m = n.match(/\ba las (\d{1,2})(?::(\d{2}))?\b/))) { res.time = `${pad(+m[1])}:${m[2] || '00'}`; }
  else if ((m = n.match(/\b(\d{1,2}):(\d{2})\b/))) res.time = `${pad(+m[1])}:${m[2]}`;
  // Profesor (usa el texto original para conservar mayúsculas)
  if ((m = text.match(/(?:profe(?:sor[a]?)?|prof\.?|docente|ing\.?|dr\.?|dra\.?)\s+((?:[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)(?:\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)?)/))) res.teacher = m[1].trim();

  const known = directory().find(s => res.subject && strip(s.subject.toLowerCase()) === strip(res.subject.toLowerCase()));

const addD = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x; };

const OCR_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const loadOCR = () => window.Tesseract ? Promise.resolve() : new Promise((ok, no) => {
  const s = document.createElement('script'); s.src = OCR_SRC; s.onload = ok; s.onerror = () => no(new Error('offline')); document.head.appendChild(s);

// Escala de grises, invierte las capturas en modo oscuro y amplía: Tesseract lee mejor texto oscuro sobre fondo claro.
async function prepImage(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(2, 2200 / Math.max(bmp.width, bmp.height)) * (bmp.width < 1000 ? 1.5 : 1);
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0, c.width, c.height);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data; let sum = 0;
  for (let i = 0; i < d.length; i += 4) { const y = .299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]; d[i] = d[i + 1] = d[i + 2] = y; sum += y; }
  const dark = sum / (d.length / 4) < 128;
  for (let i = 0; i < d.length; i += 4) { let v = dark ? 255 - d[i] : d[i]; v = v < 60 ? 0 : v > 190 ? 255 : (v - 60) * 255 / 130; d[i] = d[i + 1] = d[i + 2] = v; }
  g.putImageData(im, 0, 0); return c;
}
const SMALL = new Set(['y', 'de', 'del', 'la', 'el', 'los', 'las', 'a', 'en', 'e', 'o', 'para', 'con']);
const titleCase = s => s.toLowerCase().split(/\s+/).map((w, i) => i && SMALL.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
const cleanTxt = s => s.replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+/, '').replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9.)]+$/, '').replace(/\s+/g, ' ').trim();
const DAY_RE = /(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)/i;
const dayOf = t => { const n = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); return ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'].findIndex(d => n.includes(d)); };
const fixTime = m => `${String(+m[1]).padStart(2, '0')}:${m[2]}`;
const tmin = s => parseInt(s) * 60 + parseInt(s.slice(3));

/* Interpreta las líneas del OCR: cada día (cabecera) y cada bloque con hora inicio/fin en la columna izquierda,
   y a su derecha materia, profesor y salón. */
function parseSchedule(lines, W) {
  const colX = W * 0.25, timeTok = /^(\d{1,2})[:.]?(\d{2})$/;
  const L = [], times = [], headers = [];
  lines.forEach(l => {
    if (DAY_RE.test(l.text) && l.text.trim().length < 40) headers.push({ day: dayOf(l.text), y: (l.bbox.y0 + l.bbox.y1) / 2 });
    const ws = l.words || [], right = [];
    ws.forEach(w => {
      const t = w.text.replace(/[^\d:.]/g, ''), m = t.match(timeTok), cx = (w.bbox.x0 + w.bbox.x1) / 2;
      if (cx < colX && m && +m[1] < 24 && +m[2] < 60) times.push({ s: fixTime(m), y: (w.bbox.y0 + w.bbox.y1) / 2 });
      else if (cx >= colX) right.push(w);
    });
    const t = right.map(w => w.text).join(' ').trim();
    if (t) L.push({ t, y: (l.bbox.y0 + l.bbox.y1) / 2 });
  });
  times.sort((a, b) => a.y - b.y); headers.sort((a, b) => a.y - b.y);
  const blocks = [];
  for (let i = 0; i < times.length;) {
    const a = times[i], b = times[i + 1];
    if (!b || tmin(b.s) <= tmin(a.s)) { i++; continue; }
    const cy = (a.y + b.y) / 2, span = Math.max(b.y - a.y, 20), hd = headers.filter(h => h.y < a.y).pop();
    if (hd) blocks.push({ day: hd.day, start: a.s, end: b.s, cy, span, txt: [] });
    i += 2;
  }
  L.forEach(l => {
    if (DAY_RE.test(l.t) || /^\d+\s*clases?$/i.test(l.t)) return;
    let best = null, bd = 1e9; blocks.forEach(b => { const d = Math.abs(l.y - b.cy); if (d < bd) { bd = d; best = b; } });
    if (best && bd <= best.span * 1.4 + 20) best.txt.push(l);
  });
  // Los íconos (persona, ubicación) salen como un carácter suelto al inicio de la línea.
  const noIcon = s => cleanTxt(s.replace(/^(\S\s+)+?(?=\S{2})/, ''));
  const out = blocks.map(b => {
    const t = b.txt.sort((p, q) => p.y - q.y).map(l => noIcon(l.t)).filter(x => x.length > 1);
    if (!t.length) return null;
    const room = t.length >= 3 ? t[t.length - 1] : '', teacher = t.length >= 2 ? t[t.length - (t.length >= 3 ? 2 : 1)] : '';
    const title = t.slice(0, Math.max(1, t.length - (t.length >= 3 ? 2 : t.length >= 2 ? 1 : 0))).join(' ');
    return { subject: titleCase(title), teacher: titleCase(teacher), room: room.toUpperCase().replace(/\|/g, 'I'), day: b.day, start: b.start, end: b.end };
  }).filter(Boolean);
  // El texto gris pequeño se lee peor: unifica el código de sede (p. ej. BOGO) con el más repetido.
  const first = r => r.room.split(' ')[0], cnt = {};
  out.forEach(c => { if (c.room) cnt[first(c)] = (cnt[first(c)] || 0) + 1; });
  const top = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  if (top && cnt[top] > 1) out.forEach(c => { const f = c.room && first(c); if (f && f !== top && f.length === top.length && [...f].filter((ch, i) => ch !== top[i]).length <= 2) c.room = top + c.room.slice(f.length); });
  // Formato "SEDE X 123": corrige confusiones típicas del OCR entre letras y dígitos.
  const toD = s => s.replace(/[OQ]/g, '0').replace(/[Il]/g, '1').replace(/A/g, '4').replace(/S/g, '5').replace(/B/g, '8');
  const toL = s => s.replace(/1/g, 'I').replace(/0/g, 'O').replace(/4/g, 'A').replace(/5/g, 'S').replace(/8/g, 'B');
  out.forEach(c => {
    if (!top || !c.room) return;
    const m = c.room.match(/^(?:(\S+)\s*)?([A-Z0-9])\s*([A-Z0-9]{3})$/);
    if (m && (/^\D+$/.test(m[1] || '') || !m[1] || /^\d+$/.test(m[1]))) c.room = `${top} ${toL(m[2])} ${toD(m[3])}`;
  });
  return out;
}

async function analyzeImage(file, onProgress) {
  onProgress(0.05, 'Preparando imagen…');
  const canvas = await prepImage(file);
  onProgress(0.1, 'Descargando lector de texto (solo la primera vez)…');
  await loadOCR();
  const worker = await Tesseract.createWorker('spa', 1, { logger: m => { if (m.status === 'recognizing text') onProgress(0.3 + m.progress * 0.65, 'Leyendo texto…'); else if (m.progress != null) onProgress(0.1 + m.progress * 0.2, 'Cargando idioma…'); } });
  try {
    await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
    const { data } = await worker.recognize(canvas);
    return { classes: parseSchedule(data.lines || [], canvas.width), events: [], raw: data.text };
  } finally { worker.terminate(); }
}

/* ================== Pomodoro ================== */
const POMO = { '25': { focus: 25, rest: 5 }, '50': { focus: 50, rest: 10 } };
const RING = 2 * Math.PI * 90;
const pomoTotal = () => POMO[state.pomo.mode][state.pomo.phase === 'focus' ? 'focus' : 'rest'] * 60;
const pomoLeft = () => state.pomo.running ? Math.max(0, Math.round((state.pomo.endsAt - Date.now()) / 1000)) : state.pomo.left;
const mmss = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function pomoDay() { if (state.pomo.day !== iso(new Date())) { state.pomo.day = iso(new Date()); state.pomo.count = 0; save(); } }
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.2, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.2); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.22); });
  } catch {}
  navigator.vibrate?.([300, 150, 300]);
}
function pomoFinish() {
  const p = state.pomo, wasFocus = p.phase === 'focus';
  pomoDay(); p.running = false;
  if (wasFocus) p.count++;
  p.phase = wasFocus ? 'rest' : 'focus'; p.left = pomoTotal(); save();
  beep();
  const msg = wasFocus ? '¡Bloque de enfoque completado! Toma un descanso.' : 'Descanso terminado. ¡A concentrarse!';
  notify(wasFocus ? '🍅 ¡Enfoque completado!' : '⏰ Fin del descanso', msg);
  const ov = document.createElement('div');
  ov.className = 'fixed inset-0 z-[70] grid place-items-center bg-emerald-600/90 backdrop-blur-sm text-white text-center p-6 fade-in';
  ov.innerHTML = `<div><div class="text-7xl animate-bounce">${wasFocus ? '🎉' : '💪'}</div><h2 class="font-title text-2xl mt-4">${wasFocus ? '¡Bien hecho!' : '¡Vamos de nuevo!'}</h2><p class="mt-2">${msg}</p><button class="mt-6 bg-white text-emerald-700 font-bold rounded-2xl px-6 py-3">Continuar</button></div>`;
  ov.querySelector('button').onclick = () => ov.remove(); document.body.appendChild(ov);
  if (tab === 'more' && sub === 'focus') render();
}
function updatePomoUI() {
  const t = $('#pomoTime'); if (!t) return;
  const left = pomoLeft(), total = pomoTotal();
  t.textContent = mmss(left);
  $('#pomoRing').style.strokeDashoffset = RING * (1 - (total - left) / total);
}
setInterval(() => { if (state.pomo.running) { if (pomoLeft() <= 0) pomoFinish(); else updatePomoUI(); } }, 500);
function viewFocus() {
  const p = state.pomo; pomoDay();

let shareOpts = { fmt: 'json', tasks: true, classes: true };

function exportPayload() {

  if (p.classes.length) { L.push('', '🗓️ HORARIO'); [...p.classes].sort((a, b) => a.day - b.day || a.start.localeCompare(b.start)).forEach(c => L.push(`${DAYS[c.day]} ${c.start}-${c.end}: ${c.subject}${c.room ? ' · ' + c.room : ''}${c.teacher ? ' · ' + c.teacher : ''}`)); }

}
function exportOutput() { return shareOpts.fmt === 'json' ? JSON.stringify(exportPayload()) : exportText(); }
const s60 = (v, n = 120) => String(v ?? '').slice(0, n);
function importPayload(raw) {
  const i = raw.indexOf('{'), j = raw.lastIndexOf('}');
  if (i < 0 || j < i) throw new Error('No se encontró código JSON');
  const d = JSON.parse(raw.slice(i, j + 1));
  if (d.app !== 'UniversityPlanner') throw new Error('Formato no reconocido');
  const haveT = new Set(state.tasks.map(taskKey)), haveC = new Set(state.classes.map(classKey));
  let nt = 0, nc = 0;
  (Array.isArray(d.tasks) ? d.tasks : []).forEach(x => {
    if (!x || typeof x.title !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(x.date || '')) return;
    const t = { id: uid(), type: TYPES[x.type] ? x.type : 'tarea', title: s60(x.title), subject: s60(x.subject), teacher: s60(x.teacher), date: x.date, time: /^\d{2}:\d{2}$/.test(x.time || '') ? x.time : '', notes: s60(x.notes, 300), done: false, fired: [] };
    if (!t.title || haveT.has(taskKey(t))) return;
    haveT.add(taskKey(t)); state.tasks.push(t); nt++;
  });
  (Array.isArray(d.classes) ? d.classes : []).forEach(x => {
    if (!x || typeof x.subject !== 'string' || !Number.isInteger(x.day) || x.day < 0 || x.day > 6 || !/^\d{2}:\d{2}$/.test(x.start || '') || !/^\d{2}:\d{2}$/.test(x.end || '')) return;
    const c = { id: uid(), subject: s60(x.subject), teacher: s60(x.teacher), room: s60(x.room, 40), day: x.day, start: x.start, end: x.end };

const compact = (s, t) => s.replace(/-/g, '') + (t ? 'T' + t.replace(':', '') + '00' : '');
function eventTimes(t) {
  if (t.time) { const [h, m] = t.time.split(':').map(Number), e = new Date(parseISO(t.date)); e.setHours(h + 1, m);
    return { start: compact(t.date, t.time), end: `${compact(iso(e))}T${pad(e.getHours())}${pad(e.getMinutes())}00`, allDay: false }; }
  return { start: compact(t.date), end: compact(iso(addD(parseISO(t.date), 1))), allDay: true };
}
const syncable = () => state.tasks.filter(t => !t.done && daysUntil(t.date) >= 0);

  tasks.forEach(t => {
    const e = eventTimes(t), ty = TYPES[t.type] || TYPES.tarea;
    L.push('BEGIN:VEVENT', `UID:${t.id}@universityplanner`, `DTSTAMP:${stamp}`,
      e.allDay ? `DTSTART;VALUE=DATE:${e.start}` : `DTSTART:${e.start}`, e.allDay ? `DTEND;VALUE=DATE:${e.end}` : `DTEND:${e.end}`,
      `SUMMARY:${icsEsc(`${ty.label}: ${t.title}`)}`, `DESCRIPTION:${icsEsc([t.subject, t.teacher && 'Prof. ' + t.teacher, t.notes].filter(Boolean).join(' · '))}`);
    REMINDERS.forEach(r => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(`${ty.label} ${REM_LABEL[r]}: ${t.title}`)}`,
      `TRIGGER:${r ? '-P' + r + 'D' : (e.allDay ? 'PT8H' : '-PT1H')}`, 'END:VALARM'));

/* ================== Cuenta / Login con Google ================== */
const domainOk = email => !ALLOWED_DOMAINS.length || ALLOWED_DOMAINS.includes(email.split('@')[1]?.toLowerCase());
function startSession(s) {
  if (!domainOk(s.email)) return loginMsg(`Solo se permiten cuentas de: ${ALLOWED_DOMAINS.join(', ')}`);
  localStorage.setItem('up.session', JSON.stringify(s)); location.reload();
}

/* ---------- Firebase (se carga solo si hay configuración) ---------- */
let fb = null;
const loadScript = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
async function fbInit() {
  if (!FB_ON) return null;
  if (fb) return fb;
  try {
    for (const f of ['app', 'auth', 'firestore']) await loadScript(`vendor/firebase-${f}-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    fb = { auth: firebase.auth(), db: firebase.firestore() };
  } catch { fb = null; }
  return fb;
}
const normCode = s => String(s || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 30);

function finishFirebaseLogin(u) {
  const email = (u.email || '').toLowerCase();
  if (!email) return loginMsg('Tu cuenta de Google no tiene correo.');
  if (!domainOk(email)) { fb?.auth.signOut(); return loginMsg(`Solo se permiten cuentas de: ${ALLOWED_DOMAINS.join(', ')}`); }
  startSession({ email, name: (u.displayName || '').split(' ')[0], picture: u.photoURL || '', provider: 'google', uid: u.uid });
}
async function googleSignIn() {
  loginMsg('');
  const f = await fbInit();
  if (!f) return loginMsg('No se pudo cargar Firebase. Revisa tu internet o usa tu correo.');
  const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
  try { finishFirebaseLogin((await f.auth.signInWithPopup(p)).user); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) return f.auth.signInWithRedirect(p);
    if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) loginMsg('No se pudo iniciar sesión (' + (e.code || 'error') + ').');
  }
}

/* Sincronización de pendientes, horario y perfil: el documento más reciente gana. */
async function cloudPush() {
  if (!cloud.ready || !cloud.ref) return;
  const json = cloudPayload(); if (json === cloud.lastJson) return;
  try { await cloud.ref.set({ data: json, updatedAt: state.cloudAt || Date.now(), email: SESSION.email }); cloud.lastJson = json; } catch { /* se reintenta en el siguiente cambio */ }
}
const mergeById = (a = [], b = []) => { const seen = new Set(a.map(x => x.id)); return [...a, ...b.filter(x => x && x.id && !seen.has(x.id))]; };
function applyRemote(d, merge) {
  let r; try { r = JSON.parse(d.data); } catch { return; }
  cloud.applying = true;
  if (merge) {
    state.tasks = mergeById(r.tasks, state.tasks); state.classes = mergeById(r.classes, state.classes);
    state.name = state.name || r.name || ''; state.groupCode = state.groupCode || r.groupCode || '';
  } else {
    state.tasks = Array.isArray(r.tasks) ? r.tasks : []; state.classes = Array.isArray(r.classes) ? r.classes : [];
    state.name = r.name || state.name; state.theme = r.theme || state.theme; state.groupCode = normCode(r.groupCode);
    state.cloudAt = d.updatedAt;
  }
  localStorage.setItem(KEY, JSON.stringify(state));
  cloud.lastJson = merge ? d.data : cloudPayload();
  cloud.applying = false;
  applyTheme();
  if (!$('#modal').classList.contains('flex') && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) render();
}
async function cloudStart() {
  if (!FB_ON || SESSION?.provider !== 'google') return;
  const f = await fbInit(); if (!f) return;
  const user = await new Promise(ok => { const un = f.auth.onAuthStateChanged(u => { un(); ok(u); }); });
  if (!user || (user.email || '').toLowerCase() !== SESSION.email) { cloud.expired = true; return; }
  SESSION.uid = user.uid;
  cloud.ref = f.db.collection('users').doc(user.uid);
  cloud.unsub = cloud.ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.exists ? snap.data() : null;
    if (!cloud.ready) {
      const hasLocal = state.tasks.length || state.classes.length;
      if (d) applyRemote(d, !!hasLocal);
      cloud.ready = true;
      if (!d || hasLocal) { state.cloudAt = Date.now(); save(); }
      chatCloudStart();
    } else if (d && d.updatedAt > (state.cloudAt || 0) && d.data !== cloud.lastJson) applyRemote(d, false);
  }, () => {});
}

/* Chat en vivo por código de grupo */
function chatCloudStart() {
  cloud.chatUnsub?.(); cloud.chatUnsub = null; cloud.chatCol = null;
  const code = normCode(state.groupCode);
  if (!code || !fb || !SESSION.uid) return;
  cloud.chatCol = fb.db.collection('groups').doc(code).collection('messages');
  cloud.chatUnsub = cloud.chatCol.orderBy('at', 'desc').limit(200).onSnapshot(s => {
    const msgs = []; s.docChanges().forEach(c => { if (c.type === 'added') msgs.push({ id: c.doc.id, ...c.doc.data(), g: code }); });
    if (mergeChat(msgs) && tab === 'more' && sub === 'chat') chatMsgsHtml();
  }, () => { toast('No se pudo conectar al grupo. Revisa las reglas de Firestore.', '⚠️'); });
}
if (!SESSION && FB_ON) fbInit().then(f => f && f.auth.getRedirectResult().then(r => r.user && finishFirebaseLogin(r.user)).catch(() => {}));
function showLogin() {
  const ov = document.createElement('div');
  ov.className = 'fixed inset-0 z-[80] overflow-y-auto bg-ink text-slate-100 grid place-items-center p-5';
  ov.innerHTML = `<div class="w-full max-w-sm text-center space-y-5 fade-in">
    <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-700 grid place-items-center text-4xl shadow-xl shadow-emerald-500/30">🎓</div>
    <div><h1 class="font-title text-2xl bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">University Planner</h1><p class="text-xs text-slate-400 mt-1">By Megabyte</p></div>
    <p class="text-sm text-slate-300">Inicia sesión con tu cuenta de Google o correo universitario para guardar tu horario y pendientes.</p>
    <div id="gBtn" class="flex justify-center min-h-[44px]"></div>
    <div class="flex items-center gap-3 text-xs text-slate-500"><i class="flex-1 h-px bg-slate-700"></i>o<i class="flex-1 h-px bg-slate-700"></i></div>
    <form id="lf" class="space-y-3 text-left">
      <input name="email" type="email" required autocomplete="email" placeholder="tu.correo@universidad.edu.co" class="${inputCls}">
      <button class="${btnP} w-full">Continuar con mi correo</button>
      <p class="text-[11px] text-slate-500">Sin Google: el correo no se verifica y solo identifica tus datos en este dispositivo.</p></form>
    <p id="loginMsg" class="text-sm text-rose-400 min-h-[1.25rem]"></p></div>`;
  document.body.appendChild(ov);
  $('#lf').onsubmit = e => {
    e.preventDefault(); const email = new FormData(e.target).get('email').trim().toLowerCase();
    startSession({ email, name: email.split('@')[0].split(/[._-]/)[0].replace(/^./, c => c.toUpperCase()), picture: '', provider: 'local' });
  };
  if (!FB_ON) { $('#gBtn').innerHTML = '<p class="text-xs text-amber-400">Google/Firebase aún no está configurado. Usa tu correo.</p>'; return; }
  $('#gBtn').innerHTML = `<button id="gGo" class="w-full max-w-[280px] flex items-center justify-center gap-3 rounded-full bg-white text-slate-800 font-semibold px-4 py-3 text-sm shadow hover:brightness-95 active:scale-95 transition">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Continuar con Google</button>`;
  $('#gGo').onclick = googleSignIn;
}
function accountModal() {
  openModal(`<div class="text-center space-y-3">
    <div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-emerald-500 to-teal-700 overflow-hidden grid place-items-center text-2xl text-white font-bold">${avatarHtml(true)}</div>
    <div><p class="font-bold">${esc(state.name || SESSION.name || 'Estudiante')}</p><p class="text-sm text-slate-500 dark:text-slate-400 break-all">${esc(SESSION.email)}</p>
    <p class="text-[11px] mt-1 ${SESSION.provider === 'google' ? 'text-emerald-500' : 'text-slate-400'}">${SESSION.provider === 'google' ? '✔ Cuenta de Google · ' + (cloud.ready ? '☁️ datos sincronizados' : cloud.expired ? '⚠️ sesión en la nube vencida, vuelve a entrar' : '☁️ conectando…') : 'Modo local (sin verificar)'}</p></div>
    <div class="flex gap-2 pt-2"><button onclick="closeModal()" class="${btnG} flex-1">Cerrar</button><button id="logout" class="${btnP} flex-1">Cerrar sesión</button></div>
    <p class="text-[11px] text-slate-500">${SESSION.provider === 'google' ? 'Tus pendientes y horario se guardan en tu cuenta y los ves en cualquier dispositivo.' : 'Tus datos quedan guardados en este dispositivo para esta cuenta.'}</p></div>`);
  $('#logout').onclick = async () => { cloud.unsub?.(); cloud.chatUnsub?.(); try { await fb?.auth.signOut(); } catch {} localStorage.removeItem('up.session'); location.reload(); };
}
function avatarHtml(big) {
  return SESSION.picture ? `<img src="${esc(SESSION.picture)}" referrerpolicy="no-referrer" alt="" class="w-full h-full object-cover">` : esc((state.name || SESSION.email)[0].toUpperCase());
}

/* ================== Init ================== */
if (!SESSION) { applyTheme(); $('#btnAcc').classList.add('hidden'); showLogin(); }
else {
  $('#btnAcc').innerHTML = avatarHtml(); $('#btnAcc').onclick = accountModal;
  if (!state.name && SESSION.name) { state.name = SESSION.name; save(); }
  applyTheme(); render(); checkReminders();
  if (!state.name && !localStorage.getItem('up.nameAsked')) { localStorage.setItem('up.nameAsked', '1'); nameForm(); }
  setInterval(checkReminders, 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkReminders(); render(); } });
  cloudStart();
}
</script>
</body>
</html>
